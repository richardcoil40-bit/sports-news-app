# The whole service. One Worker, one KV namespace, one secret.
#
# Deploy:
#   cd worker
#   npm install
#   npx wrangler kv namespace create VERDICTS      # paste the id below
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put CLIENT_TOKEN           # optional, see README
#   npx wrangler deploy
#
# Source vetting (/v1/vet-source) is off until its own key is set, and
# deliberately has no fallback to the key above:
#   npx wrangler secret put VET_ANTHROPIC_API_KEY  # enables the endpoint
#   npx wrangler secret put VET_TOKEN              # optional, as CLIENT_TOKEN

name = "nofrills-verdicts"
main = "src/index.ts"
compatibility_date = "2026-08-18"
# The Anthropic SDK is a normal npm package built on fetch; nodejs_compat is
# what lets Wrangler bundle it for the Workers runtime.
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "VERDICTS"
id = "5bba8039a42f49418095e9e2e8c4a676"

[vars]
# Cheapest capable model, per docs/deferred-work.md — this is a
# single-enum-per-field classification, not a reasoning task. Override here
# (not in code) if a verdict quality problem ever justifies the cost.
MODEL = "claude-haiku-4-5"

# Hard brake #1: the most model calls this Worker will make in a UTC day.
# Each call classifies up to 100 headlines, so 40 ≈ 4,000 new headlines/day —
# far more than 35 feeds actually produce. Past the cap the endpoint keeps
# serving cached verdicts and tells the client it is degraded, which the app
# reads as "use the local rules". A bug or an abused endpoint costs a capped
# amount and a slightly worse feed, never a surprise bill.
#
# Hard brake #2 is not in this file and is the more important one: set a
# spend limit on the Anthropic account itself.
DAILY_CALL_CAP = "40"

# Verdicts are about a fixed string of text, so they never go stale — this
# TTL exists only to bound storage, not to refresh anything.
VERDICT_TTL_DAYS = "90"

# Source vetting. Every value here is separate from the four above rather
# than shared, so that scoring candidate sources can never eat the budget
# the live app's verdicts run on. See the header of src/index.ts.

# Not the cheapest model, unlike MODEL, and for the reason stated there:
# classification is one enum per field, while this weighs seven criteria
# and has to explain each. Volume is a few dozen sources per league,
# reviewed by hand — so the cost of the better model is rounding, and the
# cost of a wrong tier that reads as researched is not.
VET_MODEL = "claude-opus-5"

# Far lower than DAILY_CALL_CAP because the shape of the work is different:
# a person runs `vet.mjs --ai` for one league, reads the output, and stops.
# Ten calls of twenty sources is two hundred sources, which is more than any
# league has. A number this small is meant to be noticed if something loops.
VET_DAILY_CALL_CAP = "10"
