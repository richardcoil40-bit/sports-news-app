name: Feed liveness check

# Runs weekly on its own schedule, and can also be triggered manually from
# the Actions tab (the workflow_dispatch trigger adds a "Run workflow"
# button). This is deliberately NOT tied to push/pull_request — a flaky
# third-party feed shouldn't block a PR that has nothing to do with it.
on:
  schedule:
    # Mondays at 13:17 UTC. Deliberately off the hour: GitHub's scheduler is
    # busiest at :00 and delays those runs the longest.
    - cron: '17 13 * * 1'
  workflow_dispatch:
    inputs:
      max_failing:
        description: 'Fail the run if more than this many sources fail. Raise it for a calibration run.'
        required: false
        default: '18'

permissions:
  contents: read

# scripts/check-feeds.sh always exits 0 — it counts failures into the report
# body, never into its exit status. Without the threshold step below, a week
# in which every single feed died would show a green check and send no
# email, and this workflow would be decorative.
#
# The number below is calibrated from real dispatch runs, not guessed,
# and re-calibrated after the SEC doubled the catalog. On 60 sources the
# runner sees roughly 46 passing / 14 failing where a home IP sees 59 / 1.
#
# Thirteen of those fourteen are where the runner sits, not dead sources:
#
#   ESPN                  202  genuine — fails from a laptop too, see
#                              docs/evidence/README.md
#   Seattle Times         202  runner-only
#   Extra Points          403  runner-only (Substack refuses datacenter IPs)
#   Eleven Warriors       403  runner-only
#   ~9 local papers       429  runner-only, and all one story: they share
#                              the TownNews/BLOX CMS (the search/?f=rss
#                              URLs), which refuses datacenter IPs as
#                              policy. Which nine varies run to run.
#
# scripts/check-feeds.sh already paces requests and retries a 429 once.
# Pacing them ten times harder was measured and bought exactly one more
# source for six more minutes, so it isn't a rate limit that patience can
# satisfy — see the note in that script before trying it again.
#
# 18 = the ~14 known-noisy plus room for the 429s to wander, which they do:
# they depend on which sites the runner reaches before being refused, not
# on whether the publisher is alive.
#
# Be clear about what this check is therefore worth. It catches a collapse
# — a whole platform going away, the catalog being emptied, the extractor
# silently drifting. It cannot see the thirteen sources the runner can't
# reach, which is most of the local-paper tier. scripts/check-feeds.sh run
# from a laptop is still the real instrument and docs/evidence/ is still
# its record; this is a smoke alarm, not a replacement.
env:
  MAX_FAILING: ${{ github.event.inputs.max_failing || '18' }}

jobs:
  check-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      # No `npm ci` on purpose: the script shells out to node only for its
      # source extractor, which uses nothing beyond `fs`.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run feed check
        id: check
        run: |
          bash scripts/check-feeds.sh | tee run.log
          # The script writes a fresh timestamped file and prints its path.
          # Capture that one specifically, so the upload below doesn't also
          # sweep up the reports already committed under docs/evidence/.
          report="$(sed -n 's/^Wrote //p' run.log | tail -1)"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      # Downloadable under the run's "Artifacts" section, kept 90 days.
      # Note that means CI runs do not maintain the docs/evidence/ record
      # itself — that still comes from running the script locally and
      # committing the report.
      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: feed-status-report
          path: ${{ steps.check.outputs.report }}
          if-no-files-found: warn

      - name: Fail if too many sources are down
        env:
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          if [ -z "$REPORT" ] || [ ! -f "$REPORT" ]; then
            echo "::error::No report was produced — check-feeds.sh failed before writing one."
            exit 1
          fi

          # The script's own warning, promoted to a failure. If its regex
          # extractor drifts out of sync with the shape of source-catalog.ts
          # it finds zero sources, and a run that checked nothing at all
          # reports a flawless score.
          if grep -q 'extracted no sources' "$REPORT"; then
            echo "::error::The source extractor found nothing — check-feeds.sh has drifted from src/lib/source-catalog.ts."
            exit 1
          fi

          summary="$(grep -oE '[0-9]+ passing, [0-9]+ failing' "$REPORT" | tail -1)"
          if [ -z "$summary" ]; then
            echo "::error::Could not find the summary line in $REPORT."
            exit 1
          fi

          passing="${summary%% passing*}"
          failing="$(printf '%s' "$summary" | sed -E 's/.*, ([0-9]+) failing/\1/')"

          echo "$summary (threshold: $MAX_FAILING failing)" >> "$GITHUB_STEP_SUMMARY"

          if [ "$passing" -eq 0 ]; then
            echo "::error::Zero sources passed. That is far more likely to be the runner's network than every publisher dying at once — check the artifact before touching the catalog."
            exit 1
          fi

          if [ "$failing" -gt "$MAX_FAILING" ]; then
            echo "::error::$failing sources failing, above the threshold of $MAX_FAILING. Download the feed-status-report artifact for the per-source detail."
            exit 1
          fi

          echo "$summary — within threshold."
