name: Feed liveness check

# Manual only. The weekly schedule was removed deliberately — see the note
# below. This is also NOT tied to push/pull_request: a flaky third-party
# feed shouldn't block a PR that has nothing to do with it.
on:
  workflow_dispatch: {}

permissions:
  contents: read

# scripts/check-feeds.sh always exits 0 — it counts failures into the report
# body, never into its exit status. Without the comparison step below, a run
# in which every feed died would show a green check and say nothing.
#
# WHAT THIS CHECKS, AND WHAT IT CANNOT
#
# From a laptop the catalog reports 59 passing / 1 failing. From a GitHub
# runner it reports 43-47 / 13-17, and all but one of those failures is the
# runner's address rather than a dead source: two 202s, two 403s, and the
# sixteen TownNews/BLOX papers (the search/?f=rss URLs), which refuse
# datacenter IPs with a 429. Which subset of the sixteen fails moves around
# run to run. Pacing requests ten times further apart was measured and
# changed nothing outside noise — see scripts/check-feeds.sh before retrying.
#
# That baseline is why this doesn't use a failure count. A count threshold
# had to sit at 22-of-60 to survive a normal run, which meant eight real
# deaths could hide underneath it — a green check that meant almost nothing.
# Instead the step below compares the *set* of failing sources against
# docs/evidence/ci-unreachable.txt and reports only names that aren't on it.
# One new failure among the ~40 sources CI can reach is now enough to fail
# the run, and the sixteen it can't reach stay the laptop's job.
#
# WHY THERE IS NO SCHEDULE
#
# It ran weekly for exactly as long as it took to notice that a green weekly
# run was reassurance nobody had earned. With the baseline comparison the
# signal is real, but the coverage still isn't: a third of the catalog is
# invisible from here, and the part that's invisible is the local-paper tier,
# which is the hardest to replace and the most likely to quietly die. A
# recurring green check on the other two-thirds is precisely the kind of
# thing that stops people running the real check.
#
# So this is a tool you point at something, not a heartbeat. Run it from the
# Actions tab when you want a second opinion from a different network.
# scripts/check-feeds.sh from a laptop remains the instrument, and
# docs/evidence/ remains the record. Restoring the schedule is four lines if
# a future catalog is less hostile to datacenter IPs than this one.

jobs:
  check-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      # No `npm ci` on purpose: the script shells out to node only for its
      # source extractor, which uses nothing beyond `fs`.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run feed check
        id: check
        run: |
          bash scripts/check-feeds.sh | tee run.log
          # The script writes two fresh timestamped files and prints both
          # paths. Capture them by extension rather than by position, so the
          # upload below doesn't sweep up the reports already committed under
          # docs/evidence/ and neither one depends on which is printed last.
          report="$(sed -n 's|^Wrote \(.*\.txt\)$|\1|p' run.log | tail -1)"
          report_json="$(sed -n 's|^Wrote \(.*\.json\)$|\1|p' run.log | tail -1)"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "report_json=$report_json" >> "$GITHUB_OUTPUT"

      # Downloadable under the run's "Artifacts" section, kept 90 days.
      # Note that means CI runs do not maintain the docs/evidence/ record
      # itself — that still comes from running the script locally and
      # committing the report.
      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: feed-status-report
          path: |
            ${{ steps.check.outputs.report }}
            ${{ steps.check.outputs.report_json }}
          if-no-files-found: warn

      - name: Compare failures against the known-unreachable baseline
        env:
          REPORT: ${{ steps.check.outputs.report }}
          REPORT_JSON: ${{ steps.check.outputs.report_json }}
          BASELINE: docs/evidence/ci-unreachable.txt
        run: |
          if [ -z "$REPORT" ] || [ ! -f "$REPORT" ]; then
            echo "::error::No report was produced — check-feeds.sh failed before writing one."
            exit 1
          fi
          if [ ! -f "$BASELINE" ]; then
            echo "::error::Baseline $BASELINE is missing. Without it every known-unreachable source reads as a new failure."
            exit 1
          fi

          # The script's own warning, promoted to a failure. If its regex
          # extractor drifts out of sync with the shape of source-catalog.ts
          # it finds zero sources, and a run that checked nothing at all
          # reports a flawless score.
          if grep -q 'extracted no sources' "$REPORT"; then
            echo "::error::The source extractor found nothing — check-feeds.sh has drifted from src/lib/source-catalog.ts."
            exit 1
          fi

          if [ -z "$REPORT_JSON" ] || [ ! -f "$REPORT_JSON" ]; then
            echo "::error::No JSON sidecar was produced alongside $REPORT."
            exit 1
          fi

          # Names and counts come from the JSON sidecar, not the text columns.
          # The text report pads the name field to 26 characters, so a longer
          # name overflows it and shifts every column after it — the parser
          # that used to live here matched on the status token to survive
          # that, and was one long publisher name away from misreading a
          # report. The sidecar has no columns to shift.
          node -e '
            const fs = require("fs");
            const rows = JSON.parse(fs.readFileSync(process.env.REPORT_JSON, "utf8"));
            const failing = rows.filter((r) => r.status !== "OK");
            fs.writeFileSync("failing.txt", [...new Set(failing.map((r) => r.name))].sort().join("\n") + "\n");
            fs.writeFileSync("counts.txt", `${rows.length - failing.length} ${failing.length}\n`);
          '
          read -r passing failing_count < counts.txt
          summary="$passing passing, $failing_count failing"
          if [ "$passing" -eq 0 ]; then
            echo "::error::Zero sources passed. That is far more likely to be the runner's network than every publisher dying at once — check the artifact before touching the catalog."
            exit 1
          fi

          # Two views of the baseline. Everything on it is allowed to fail;
          # only the entries NOT marked "~" (intermittent) are expected to
          # fail every single time, so only those are worth flagging when
          # they pass. Without that split, the 3-7 TownNews papers that
          # happen to succeed on any given run would be reported as
          # recoveries every time — telling you to prune entries you have to
          # keep, which is how a notice trains people to ignore it.
          entries="$(grep -v '^[[:space:]]*#' "$BASELINE" | sed 's/[[:space:]]*$//' | grep -v '^$')"
          printf '%s\n' "$entries" | sed 's/^~[[:space:]]*//' | sort -u > baseline.txt
          printf '%s\n' "$entries" | grep -v '^~' | sort -u > stable.txt

          new_failures="$(comm -23 failing.txt baseline.txt)"
          recovered="$(comm -13 failing.txt stable.txt)"

          {
            echo "$summary"
            echo ""
            echo "Baseline: $(wc -l < baseline.txt | tr -d ' ') sources known unreachable from CI."
          } >> "$GITHUB_STEP_SUMMARY"

          # Not a failure — a source that came back means the baseline is
          # carrying an excuse it no longer needs. Surfaced so the list gets
          # pruned rather than quietly growing into a blanket exemption.
          if [ -n "$recovered" ]; then
            {
              echo ""
              echo "Recovered — consider removing from $BASELINE:"
              printf '%s\n' "$recovered" | sed 's/^/  - /'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::These baseline sources passed and could be pruned: $(printf '%s' "$recovered" | tr '\n' ' ')"
          fi

          if [ -n "$new_failures" ]; then
            {
              echo ""
              echo "NEW failures, not on the baseline:"
              printf '%s\n' "$new_failures" | sed 's/^/  - /'
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$new_failures" | while IFS= read -r name; do
              echo "::error::$name is failing and is not a known-unreachable source. Download the feed-status-report artifact for its status code."
            done
            exit 1
          fi

          echo "$summary — no failures outside the known-unreachable baseline."
